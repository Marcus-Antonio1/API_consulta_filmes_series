<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MarkFilmes - Catalogo de filmes e series">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0"/>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/home.css">
  <title>MarkFilmes</title>
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho__logo">
      <img src="./img/LogoMarkFilmes.png" alt="MarkFilmes">
    </div>
    <div class="select-wrapper">
      <select data-categorias>
        <option value="todos">Categorias</option>
        <option value="comedia">Comédia</option>
        <option value="acao">Açao</option>
        <option value="crime">Crime</option>
        <option value="drama">Drama</option>
        <option value="aventura">Aventura</option>
      </select>
    </div>
    <div class="cabecalho__busca">
      <div class="busca-wrapper">
        <input type="text" id="input-busca" placeholder="Buscar filme ou serie..." autocomplete="off">
        <button id="btn-busca">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
      <div id="feedback-busca" class="feedback-busca" style="display:none"></div>
    </div>
    <nav class="cabecalho__opcoes">
      <a href="index.html" class="active">Home</a>
      <a href="filmes.html">Filmes</a>
      <a href="series.html">Séries</a>
    </nav>
  </header>

  <main>
    
    <div class="hero">
      <div>
        <h1>Seu catálogo  de<br><span>filmes e séries</span></h1>
        <p>Busque qualquer título  e ele será adicionado automaticamente ao catálogo com sinopse traduzida.</p>
      </div>
      <div>
        <div class="hero-busca-wrapper">
          <input type="text" id="hero-input" placeholder="Ex: Breaking Bad, Inception...">
          <button id="hero-btn">Buscar</button>
        </div>
        <div id="hero-feedback" style="margin-top:0.5em;font-size:0.8rem;min-height:1.2em;color:#7dc9f0"></div>
      </div>
    </div>

    <section data-name="lancamentos" class="section" data-titulo="Lançamentos">
      <h2>Lançamentos</h2>
    </section>

    <section data-name="top5" class="section" data-titulo="Mais populares">
      <h2>Mais populares</h2>
    </section>

    <section data-name="series" class="section" data-titulo="Series">
      <h2>Séries</h2>
    </section>

    <div class="separador" data-separador></div>

    <section data-name="filmes" class="section section--filmes" data-titulo="Filmes">
      <h2>Filmes</h2>
    </section>

    <section data-name="categoria" class="hidden pesquisa">
      <h2>Categoria</h2>
    </section>
  </main>

  <script src="./scripts/index.js" type="module"></script>
</body>
</html>
